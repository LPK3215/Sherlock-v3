[project]
name = "gemini-screen-ui-kit"
version = "0.1.0"
description = "Pipecat Example showcasing Gemini Live with screen share capabilities"
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[webrtc,silero,openai,runner,whisper,funasr,kokoro,moonshine,piper,pocket-tts]>=1.7.0",
    "piper-tts[zh]>=1.6.0",
    "regex>=2026.7.19",
]

[dependency-groups]
dev = [
    "ruff~=0.12.1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I"]
